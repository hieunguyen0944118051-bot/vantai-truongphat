services:
  - type: web
    name: vantai-truongphat
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      # Bí mật — đặt giá trị trong Render > Environment, KHÔNG ghi vào file này
      - key: JWT_SECRET        # khóa ký phiên đăng nhập (chuỗi ngẫu nhiên dài)
        sync: false
      - key: ADMIN_PASSWORD    # mật khẩu tài khoản admin (đặt lại mỗi lần khởi động)
        sync: false
      - key: SECURITY_PIN      # mã PIN cấp 2
        sync: false
      - key: BA_USERNAME       # tài khoản GPS Bình Anh
        sync: false
      - key: BA_PASSWORD
        sync: false
