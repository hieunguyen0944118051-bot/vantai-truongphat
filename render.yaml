services:
  - type: web
    name: vantai-truongphat
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      # Bí mật — đặt giá trị trong Render > Environment, KHÔNG ghi vào file này
      - key: JWT_SECRET        # khóa ký phiên đăng nhập (chuỗi ngẫu nhiên dài)
        sync: false
      - key: ADMIN_PASSWORD    # mật khẩu tài khoản admin (đặt lại mỗi lần khởi động)
        sync: false
      - key: SECURITY_PIN      # mã PIN cấp 2
        sync: false
      - key: BA_USERNAME       # tài khoản GPS Bình Anh
        sync: false
      - key: BA_PASSWORD
        sync: false
      # GĐ2 — ghi vào Google Sheets qua Apps Script (xem apps_script/HUONG_DAN.md). Thiếu thì app chỉ đọc.
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_KEY
        sync: false
      - key: XE_WRITE_ROLES    # vai trò được nhập/sửa (mặc định admin,manager)
        sync: false
      - key: FUEL_NORM_BEN     # định mức L/100km xe ben (mặc định 44.5)
        sync: false
      - key: FUEL_NORM_THUNG   # định mức L/100km xe thùng (mặc định 42)
        sync: false
